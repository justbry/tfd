<nav class="brief-nav" aria-label="Brief paths">
  <a class="brief-nav__home" href="/">
    <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <path d="M20 8 H80 V36 H20 Z" fill="#e8a33d" />
      <path d="M20 36 H80 V64 H20 Z" fill="#1e2a44" />
      <path d="M20 64 H80 V86 L72.5 93 L65 86 L57.5 93 L50 86 L42.5 93 L35 86 L27.5 93 L20 86 Z" fill="#2f7d5b" />
      <path d="M20 36 H80 M20 64 H80" stroke="#f6f1e7" stroke-width="3" stroke-dasharray="6 4" />
    </svg>
    <span>All paths</span>
  </a>
  <details class="brief-nav__switch">
    <summary>Switch path</summary>
    <ul>
      <li><a href="/overview/">The 5-minute overview</a></li>
      <li><a href="/investors/">Investors</a></li>
      <li><a href="/firms/">Accounting firms and bookkeepers</a></li>
      <li><a href="/schools/">Schools, co-ops and churches</a></li>
      <li><a href="/partners/">Partners: networks, co-ops, affiliates, software</a></li>
    </ul>
  </details>
  <span class="brief-nav__here"></span>
  <a class="brief-nav__print" href="?print-pdf">Print or save as PDF</a>
</nav>
<script>
(() => {
  const nav = document.querySelector(".brief-nav");
  if (!nav) return;
  const here = location.pathname.replace(/index\.html$/, "");
  for (const link of nav.querySelectorAll("details a")) {
    if (link.getAttribute("href") === here) {
      link.setAttribute("aria-current", "page");
      nav.querySelector(".brief-nav__here").textContent = `You're on: ${link.textContent}`;
    }
  }
  nav.querySelector(".brief-nav__print").setAttribute("href", `${here}?print-pdf`);

  const menu = nav.querySelector("details");
  const close = () => {
    if (menu.open) menu.open = false;
  };
  document.addEventListener("click", (event) => {
    if (!menu.contains(event.target)) close();
  });
  nav.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && menu.open) {
      close();
      menu.querySelector("summary").focus();
      event.stopPropagation();
    }
  });

  // Name reveal's own controls for screen readers: the slide menu button and the slide-number link.
  const labelControls = (deck) => {
    const menuButton = document.querySelector(".slide-menu-button a");
    if (menuButton) menuButton.setAttribute("aria-label", "Open the slide menu");
    const number = document.querySelector(".slide-number a, .slide-number");
    if (number) number.setAttribute("aria-label", `Slide ${deck.getSlidePastCount() + 1} of ${deck.getTotalSlides()}`);
  };

  const setUp = () => {
    const deck = window.Reveal;
    if (!deck?.on) return setTimeout(setUp, 50);
    // On a phone the 1280×720 slide would shrink to about a third: use a narrow design size (and the stacked
    // layouts in brief.scss) instead.
    let narrow = null;
    const fit = () => {
      const isNarrow = window.innerWidth < 700;
      if (isNarrow === narrow) return;
      narrow = isNarrow;
      deck.configure(
        isNarrow
          ? { width: 640, height: Math.round((640 * window.innerHeight) / window.innerWidth), margin: 0.04 }
          : { width: 1280, height: 720, margin: 0.08 },
      );
    };
    const apply = () => {
      // Keys pressed while the path menu has focus belong to the menu, not the deck. Phones (under 600px) get the scroll view.
      deck.configure({ keyboardCondition: (event) => !nav.contains(event.target), scrollActivationWidth: 600 });
      fit();
      labelControls(deck);
      setTimeout(() => labelControls(deck), 300);
    };
    if (deck.isReady?.()) apply();
    else deck.on("ready", apply);
    window.addEventListener("resize", fit);
    deck.on("slidechanged", () => labelControls(deck));
  };
  setUp();
})();
</script>
