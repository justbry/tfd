<nav class="brief-nav" aria-label="Brief paths">
  <a class="brief-nav__home" href="/">
    <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <g stroke="#f6f1e7" stroke-width="4" stroke-linejoin="round">
        <path d="M50 58.7 L50 10 L10 83 Z" fill="#e8a33d" />
        <path d="M50 58.7 L10 83 L90 83 Z" fill="#1e2a44" />
        <path d="M50 58.7 L90 83 L50 10 Z" fill="#2f7d5b" />
      </g>
    </svg>
    <span>All paths</span>
  </a>
  <details class="brief-nav__switch">
    <summary>Switch path</summary>
    <ul>
      <li><a href="/overview/">The 5-minute overview</a></li>
      <li><a href="/investors/">Investors</a></li>
      <li><a href="/firms/">Accounting firms and bookkeepers</a></li>
      <li><a href="/schools/">Schools</a></li>
      <li><a href="/partners/">Partners: networks, co-ops, affiliates, vertical software</a></li>
    </ul>
  </details>
  <span class="brief-nav__here" aria-hidden="true"></span>
  <a class="brief-nav__print" href="?print-pdf">Print or save as PDF</a>
</nav>
<script>
(() => {
  const nav = document.querySelector(".brief-nav");
  if (!nav) return;
  const here = location.pathname.replace(/index\.html$/, "");
  for (const link of nav.querySelectorAll("details a")) {
    if (link.getAttribute("href") === here) {
      link.setAttribute("aria-current", "page");
      nav.querySelector(".brief-nav__here").textContent = link.textContent;
    }
  }
  nav.querySelector(".brief-nav__print").setAttribute("href", `${here}?print-pdf`);

  const menu = nav.querySelector("details");
  const close = () => {
    if (menu.open) menu.open = false;
  };
  document.addEventListener("click", (event) => {
    if (!menu.contains(event.target)) close();
  });
  nav.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && menu.open) {
      close();
      menu.querySelector("summary").focus();
      event.stopPropagation();
    }
  });

  // Keys pressed while the path menu has focus (Space, Enter, arrows, Escape) belong to the menu, not to the deck.
  const keepKeysInNav = () => {
    const deck = window.Reveal;
    if (!deck?.on) return setTimeout(keepKeysInNav, 50);
    const apply = () => deck.configure({ keyboardCondition: (event) => !nav.contains(event.target) });
    if (deck.isReady?.()) apply();
    else deck.on("ready", apply);
  };
  keepKeysInNav();
})();
</script>
