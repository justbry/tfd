<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -8 72 72" role="img" aria-labelledby="t"><title id="t">Trifold mark, concept A, folds once</title><style>.f{transform-box:view-box;transform-origin:32px 9.5px;transform:scaleY(-1);fill:var(--b);stroke:var(--b);stroke-width:.4;stroke-linejoin:round}.h{fill-opacity:.4}@media (prefers-reduced-motion:reduce){.f,.h,.s{animation:none!important}.s{display:none}}.f{animation:fold .8s both}.h{animation:shadein .5s both}.h{animation-delay:1.9s!important}@keyframes fold{0%{transform:scaleY(1);fill:var(--a);stroke:var(--a);animation-timing-function:cubic-bezier(.55,0,1,.45);}47%{transform:scaleY(0.15);fill:var(--am);stroke:var(--am);animation-timing-function:linear;}53%{transform:scaleY(-0.15);fill:var(--bm);stroke:var(--bm);animation-timing-function:cubic-bezier(0,.55,.45,1);}100%{transform:scaleY(-1);fill:var(--b);stroke:var(--b);}}@keyframes shadein{from{fill-opacity:0}to{fill-opacity:.4}}</style><polygon points="23.34,9.5 40.66,9.5 57.98,39.5 49.32,54.5 14.68,54.5 6.02,39.5" fill="#1E2A44"/><clipPath id="c"><polygon points="23.34,9.5 40.66,9.5 57.98,39.5 49.32,54.5 14.68,54.5 6.02,39.5"/></clipPath><g clip-path="url(#c)"><polygon class="h" style="animation-delay:0.35s" points="34.5,27.5 43.16,12.5 25.84,12.5" fill="#000"/><polygon class="h" style="animation-delay:0.85s" points="43.16,42.5 51.82,57.5 60.48,42.5" fill="#000"/><polygon class="h" style="animation-delay:1.35s" points="25.84,42.5 8.52,42.5 17.18,57.5" fill="#000"/></g><g transform="rotate(0 32 34.5)"><polygon class="f" points="32,-5.5 40.66,9.5 23.34,9.5" style="--a:#1E2A44;--b:#E8A33D;--am:#34456B;--bm:#B9802A;animation-delay:0.35s"/></g><g transform="rotate(120 32 34.5)"><polygon class="f" points="32,-5.5 40.66,9.5 23.34,9.5" style="--a:#1E2A44;--b:#E8A33D;--am:#34456B;--bm:#B9802A;animation-delay:0.85s"/></g><g transform="rotate(240 32 34.5)"><polygon class="f" points="32,-5.5 40.66,9.5 23.34,9.5" style="--a:#1E2A44;--b:#E8A33D;--am:#34456B;--bm:#B9802A;anima