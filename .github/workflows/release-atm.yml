name: Release tfd (and atm)

# Pushing a tag tfd-v<version> or atm-v<version> builds packages/atm at that tag and puts the tarball on the GitHub
# releases of justbry/tfd. For the rename window one version is published under both names: tfd-v<version> with
# tfd-<version>.tgz and atm-v<version> with atm-<version>.tgz, at the same commit (release.ts). A release that already
# exists (`bun run --cwd packages/atm release` made it from a laptop) is checked: its asset must be exactly what this
# commit builds, or the run fails; a missing one is created. B4 Uni's family service pins the asset URL and its sha512.

on:
  push:
    tags: ["tfd-v*", "atm-v*"]

permissions:
  contents: write

# One group for both tag names, so the two runs a release starts take turns instead of racing to create the same
# release; the second finds both releases and only checks them.
concurrency:
  group: release-tfd
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release
        run: bun run --cwd packages/atm release --ci
        env:
          GH_TOKEN: ${{ github.token }}
