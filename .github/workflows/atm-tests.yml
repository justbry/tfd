name: atm tests

# Tests, typecheck, lint and build of packages/atm on a pull request. Nothing else in this repository runs atm's tests:
# knip.yml and the inherited Autumn workflows do not, and release-atm.yml only builds a tag.
#
# Five jobs run side by side. `test` is a matrix of four: two shards of the test files and two of the golden end-to-end
# check (tests/golden-e2e-check.test.ts, its own file of about five minutes, split with ATM_GOLDEN_E2E_SHARD). `checks`
# runs the typecheck, lint and build. All of them restore Bun's install cache, keyed on bun.lock and .bun-version.
#
# The test shards are balanced with tests/test-timings.json, each file's serial time on a hosted runner: a file left out of
# it (a new one, or one that skips on a runner) still runs, in whichever shard bun puts it. To refresh it, run every file
# at once (not a shard: a shard writes only its own files) and format it after, as bun writes it with spaces:
#   bun test --timeout 60000 --timings=tests/test-timings.json --update-timings tests
#   ../../node_modules/.bin/biome check --write tests/test-timings.json
#
# Where it runs follows B4 Uni's CI (buzz-school docs/ci-and-deploy.md): the repository variable CI_RUNNER, a JSON
# runner label list, sends the job to a self-hosted Sprite box (for example '["self-hosted","b4u-sprite"]'); unset, it
# runs on a GitHub-hosted runner. A box has to be registered to THIS repository first (runners are not shared across
# repositories under a user account). `gh variable delete CI_RUNNER` puts CI back on hosted runners at once.
#
# A draft pull request runs nothing until it is marked ready (the same rule as B4 Uni's CI: a push cancels the branch's
# older run, so a draft that is pushed to often would only burn minutes).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, staging, dev]
    paths:
      - "packages/atm/**"
      - "packages/balance-engine/**"
      - "packages/ksuid/**"
      - "packages/ledger-ui/src/fixtures/disclosure.json"
      - "packages/ledger-ui/src/data/disclosure.ts"
      - "shared/**"
      - "package.json"
      - "biome.json"
      - "bun.lock"
      - ".bun-version"
      - ".github/workflows/atm-tests.yml"
  push:
    branches: [dev]
    paths:
      - "packages/atm/**"
      - "packages/balance-engine/**"
      - "packages/ksuid/**"
      - "packages/ledger-ui/src/fixtures/disclosure.json"
      - "packages/ledger-ui/src/data/disclosure.ts"
      - "shared/**"
      - "package.json"
      - "biome.json"
      - "bun.lock"
      - ".bun-version"
      - ".github/workflows/atm-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atm-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: atm (${{ matrix.part }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: tests 1/2
            shard: 1/2
          - part: tests 2/2
            shard: 2/2
          - part: golden 1/2
            golden: 1/2
          - part: golden 2/2
            golden: 2/2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The tarball is cached, so a release-CDN outage on github.com does not fail the job once one run has fetched it.
      - name: Cache hledger
        uses: actions/cache@v4
        with:
          path: ~/.cache/hledger
          key: hledger-1.52.1-linux-x64

      # The journal and report tests that call hledger skip themselves when it is not installed, which on a runner means
      # they never run: so the version their golden CSV was made with is installed here, from the release, checked
      # against the sha256 GitHub publishes for it. A box that already has this version keeps it. The download goes
      # through the API's asset route (asset 407746896 is 1.52.1's hledger-linux-x64.tar.gz), which keeps answering
      # while github.com's release pages answer 504.
      - name: Install hledger
        env:
          HLEDGER_VERSION: "1.52.1"
          HLEDGER_ASSET_ID: "407746896"
          HLEDGER_SHA256: 55bff5785d7528b939e4642a21d3c12a75a8095fedc973340b31dfd7367dd7a2
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(uname -s)-$(uname -m)" != "Linux-x86_64" ]; then
            echo "::warning::hledger $HLEDGER_VERSION is installed for Linux x86_64 only; the hledger tests will skip here"
            exit 0
          fi
          if command -v hledger >/dev/null && [ "$(hledger --version | awk '{print $2}' | tr -d ,)" = "$HLEDGER_VERSION" ]; then
            hledger --version
            exit 0
          fi
          dir="$RUNNER_TEMP/hledger"
          cache="$HOME/.cache/hledger"
          mkdir -p "$dir" "$cache"
          if ! echo "$HLEDGER_SHA256  $cache/hledger.tar.gz" | sha256sum --check --status - 2>/dev/null; then
            curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors \
              --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/octet-stream" \
              --output "$cache/hledger.tar.gz" \
              "https://api.github.com/repos/hledgerorg/hledger/releases/assets/$HLEDGER_ASSET_ID"
          fi
          echo "$HLEDGER_SHA256  $cache/hledger.tar.gz" | sha256sum --check -
          tar -xzf "$cache/hledger.tar.gz" -C "$dir" hledger
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/hledger" --version

      # The journal tests that spawn atm's CLI take about 0.6 s per spawn, so the default 5 s test timeout is too short on
      # a slow box. --parallel runs the shard's files in one worker process per CPU core, each file in its own global scope,
      # the slowest first.
      - name: Test
        if: matrix.shard
        working-directory: packages/atm
        run: >-
          bun test --timeout 60000 --parallel --shard=${{ matrix.shard }} --timings=tests/test-timings.json
          --path-ignore-patterns='**/golden-e2e-check.test.ts' tests

      - name: Golden end-to-end check
        if: matrix.golden
        working-directory: packages/atm
        env:
          ATM_GOLDEN_E2E_SHARD: ${{ matrix.golden }}
        run: bun test --timeout 60000 tests/golden-e2e-check.test.ts

  checks:
    name: atm (tsc, lint, build)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/atm
        run: bunx tsc --noEmit

      - name: Lint
        working-directory: packages/atm
        run: ../../node_modules/.bin/biome check --no-errors-on-unmatched .

      - name: Build
        working-directory: packages/atm
        run: bun ./build.ts
