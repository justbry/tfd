<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090F;--raised:#0E1424;--fg:#E9ECF4;--muted:#9AA3B8;--dim:#4A5268;--line:#FFFFFF14;--proof:#5BE3A1;--seal:#F2B447;--ember:#FF9B54;--alert:#E07A5F}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif}
.win{border-radius:14px;overflow:hidden;border:1px solid #2a3145;background:var(--bg);color:var(--fg)}
.chrome{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#141a2b;border-bottom:1px solid #222a3e}
.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:#3a4258}
.url{flex:1;font:12px "JetBrains Mono",monospace;color:#c9cfdd;background:#0b1020;border-radius:7px;padding:5px 10px}
.url b{color:var(--fg);font-weight:500}.lock{color:var(--proof)}
.mono{font-family:"JetBrains Mono",monospace}.lbl{font:11px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.disp{font-family:Fraunces,serif;font-weight:300}
.btn{display:inline-block;background:var(--seal);color:#16203a;font-weight:600;font-size:13px;border-radius:9px;padding:8px 14px}
.ghost{display:inline-block;border:1px solid #2a3145;color:var(--fg);font-size:13px;border-radius:9px;padding:7px 13px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:14px}
.ok{color:var(--proof)}.tnum{font-variant-numeric:tabular-nums}
.stage{background:var(--ember);color:#16203a;font:600 10px "JetBrains Mono",monospace;letter-spacing:.1em;padding:3px 7px;border-radius:5px}
</style></head><body>
